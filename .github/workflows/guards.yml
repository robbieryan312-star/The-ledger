name: Guards

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run test:typecheck

      - name: Guard suites
        run: |
          npm run test:crec
          npm run test:org-join
          npm run test:source-integrity
          npm run test:copy-compliance
          npm run test:topic-positions-bundle
          npm run test:news-registry
          npm run test:profile-snapshots
          npm run test:client-bundle
          npm run test:docs-integrity
          npm run test:docs-consistency
          npm run test:governor-identity
          npm run test:identity-integrity
          npm run test:data-layout
          npm run test:env-truth
          npm run test:optimization

      - name: Profile credibility audit (P0/P1 gate)
        run: npm run audit:profile-credibility

      - name: Install Playwright Chromium (render-integrity)
        run: npx playwright install chromium

      - name: Production build
        run: npm run build

      - name: Render integrity (Playwright)
        run: npm run test:render-integrity

      - name: Client chunk budget
        run: npm run test:client-chunks
