name: Guards

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run test:typecheck

      - name: Guard suites
        run: |
          npm run test:crec
          npm run test:org-join
          npm run test:source-integrity
          npm run test:copy-compliance
          npm run test:topic-positions-bundle
          npm run test:news-registry
          npm run test:profile-snapshots
          npm run test:client-bundle
          npm run test:docs-integrity
          npm run test:docs-consistency
          npm run test:governor-identity
          npm run test:identity-integrity
          npm run test:no-unverified-official-data
          npm run test:state-economic-display
          npm run test:data-layout
          npm run test:env-truth
          npm run test:optimization

      - name: Profile credibility audit (P0/P1 gate)
        run: npm run audit:profile-credibility

      - name: Install Playwright Chromium (render-integrity)
        run: npx playwright install chromium

      - name: Production build
        run: RENDER_INTEGRITY_SKIP_POSTBUILD=1 npm run build

      - name: Render integrity (Playwright)
        run: |
          npx next start -H 127.0.0.1 -p 4112 &
          SERVER_PID=$!
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:4112/states/FL | grep -q 'id="section-01"'; then
              break
            fi
            sleep 2
          done
          curl -sf http://127.0.0.1:4112/states/FL | grep -q 'id="section-01"'
          RENDER_INTEGRITY_EXTERNAL_SERVER=1 npm run test:render-integrity
          kill $SERVER_PID

      - name: Client chunk budget
        run: npm run test:client-chunks
