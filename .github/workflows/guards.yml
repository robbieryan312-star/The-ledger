name: Guards

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Guard suites
        run: |
          npm run test:crec
          npm run test:org-join
          npm run test:source-integrity
          npm run test:copy-compliance
          npm run test:topic-positions-bundle
          npm run test:news-registry
          npm run test:profile-snapshots
          npm run test:client-bundle

      - name: Production build
        run: npm run build

      - name: Client chunk budget
        run: npm run test:client-chunks
