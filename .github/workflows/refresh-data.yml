name: Refresh Florida data

# Keeps /data snapshots current automatically. No-key public sources refresh on
# every run; keyed sources refresh only when their GitHub Actions secret is set.
# Changed snapshots land on data-refresh branch via PR — never push main directly.
# Guard suites + build must pass before any commit; fetch-failed artifacts excluded.

on:
  schedule:
    - cron: '23 9 * * *' # daily at 09:23 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      - name: No-key ingests (always)
        run: npm run ingest:no-key

      - name: Keyed ingests (only when the matching secret is set)
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
          GOVINFO_API_KEY: ${{ secrets.GOVINFO_API_KEY }}
          LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
          OPENSTATES_API_KEY: ${{ secrets.OPENSTATES_API_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        run: |
          [ -n "$CENSUS_API_KEY" ] && npm run ingest:census-fl || echo "skip census (no secret)"
          [ -n "$LEGISCAN_API_KEY" ] && npm run ingest:legiscan-fl || echo "skip legiscan (no secret)"
          [ -n "$OPENSTATES_API_KEY" ] && npm run ingest:openstates-fl || echo "skip openstates (no secret)"
          [ -n "$NEWSAPI_KEY" ] && npm run ingest:news-fl || echo "skip news (no secret)"
          { [ -n "$GOVINFO_API_KEY" ] || [ -n "$DATA_GOV_API_KEY" ]; } && npm run ingest:govinfo-fl || echo "skip govinfo (no secret)"
          [ -n "$FEC_API_KEY" ] && npm run ingest:fec-fl && npm run sync:fec-national && npm run sync:fec-schedule-a || echo "skip fec (no secret)"
          [ -n "$CONGRESS_API_KEY" ] && npm run ingest:congress-fl && npm run sync:votes-national || echo "skip congress (no secret)"

      - name: Rebuild Records & Sources index
        run: npm run build:sources-index && npm run build:data-slices

      - name: Run guard suites and build (abort on failure — no commit)
        run: |
          npm run test:crec
          npm run test:org-join
          npm run test:source-integrity
          npm run test:copy-compliance
          npm run test:classify
          npm run build

      - name: Exclude fetch-failed artifacts from commit
        run: bash scripts/exclude-fetch-failed-artifacts.sh

      - name: Commit to data-refresh branch and open PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "ledger-data-bot"
          git config user.email "ledger-data-bot@users.noreply.github.com"
          git checkout -B data-refresh
          git add data/ lib/data/generated/sourcesIndex.json lib/data/generated/slices/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "chore(data): scheduled snapshot refresh"
          git push -u origin data-refresh --force
          EXISTING=$(gh pr list --head data-refresh --base main --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            echo "Updated existing PR #$EXISTING"
          else
            gh pr create --base main --head data-refresh \
              --title "chore(data): scheduled snapshot refresh" \
              --body "Automated data refresh. Guard suites + build passed before commit. Fetch-failed artifacts excluded per §6."
          fi
