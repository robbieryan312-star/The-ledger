name: Refresh Florida data

# Keeps /data snapshots current automatically. No-key public sources refresh on
# every run; keyed sources refresh only when their GitHub Actions secret is set.
# Changed snapshots land on data-refresh branch via PR — never push main directly.
# Guard suites + build must pass before any commit; fetch-failed artifacts excluded.

on:
  schedule:
    - cron: '23 9 * * *' # daily at 09:23 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      - name: No-key ingests (always)
        run: npm run ingest:no-key

      - name: Keyed ingests (only when the matching secret is set)
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
          GOVINFO_API_KEY: ${{ secrets.GOVINFO_API_KEY }}
          LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
          OPENSTATES_API_KEY: ${{ secrets.OPENSTATES_API_KEY }}
          COURTLISTENER_API_KEY: ${{ secrets.COURTLISTENER_API_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
        run: |
          set -euo pipefail

          if [ -n "$CENSUS_API_KEY" ]; then
            npm run ingest:census-fl
            npm run ingest:fl-counties
          else
            echo "skip census/fl-counties (no CENSUS_API_KEY)"
          fi

          if [ -n "$BEA_API_KEY" ]; then
            npm run ingest:bea-rpp-fl
          else
            echo "skip bea-rpp (no BEA_API_KEY)"
          fi

          npm run ingest:fl-tax || echo "skip fl-tax (non-fatal — computed from published tables)"

          if [ -n "$LEGISCAN_API_KEY" ]; then
            npm run ingest:legiscan-fl
          else
            echo "skip legiscan (no LEGISCAN_API_KEY)"
          fi

          if [ -n "$OPENSTATES_API_KEY" ]; then
            npm run ingest:openstates-fl
          else
            echo "skip openstates (no OPENSTATES_API_KEY)"
          fi

          if [ -n "$COURTLISTENER_API_KEY" ]; then
            npm run ingest:courts-fl
          else
            echo "skip courts detail refresh (no COURTLISTENER_API_KEY)"
          fi

          if [ -n "$NEWSAPI_KEY" ]; then
            npm run ingest:news-fl
          else
            echo "skip news (no NEWSAPI_KEY)"
          fi

          if [ -n "$GOVINFO_API_KEY" ] || [ -n "$DATA_GOV_API_KEY" ]; then
            npm run ingest:govinfo-fl
          else
            echo "skip govinfo (no GOVINFO_API_KEY or DATA_GOV_API_KEY)"
          fi

          if [ -n "$FEC_API_KEY" ]; then
            npm run ingest:fec-fl
            npm run sync:fec-national -- --full-corpus
            npm run sync:fec-schedule-a
          else
            echo "skip fec (no FEC_API_KEY)"
          fi

          if [ -n "$CONGRESS_API_KEY" ]; then
            npm run ingest:congress-fl
            npm run sync:votes-national
          else
            echo "skip congress (no CONGRESS_API_KEY)"
          fi

          npm run sync:stock-trades || echo "skip stock-trades (non-fatal)"

      - name: Rebuild Records & Sources index
        run: npm run build:sources-index && npm run build:data-slices

      - name: Guard suites aligned with guards.yml (abort on failure — no commit)
        run: |
          npm run test:typecheck
          npm run test:crec
          npm run test:org-join
          npm run test:source-integrity
          npm run test:copy-compliance
          npm run test:topic-positions-bundle
          npm run test:news-registry
          npm run test:profile-snapshots
          npm run test:client-bundle
          npm run test:docs-integrity
          npm run test:docs-consistency
          npm run test:governor-identity
          npm run test:identity-integrity
          npm run test:no-unverified-official-data
          npm run test:state-economic-display
          npm run test:data-layout
          npm run test:env-truth
          npm run test:optimization
          npm run audit:profile-credibility
          npx playwright install chromium
          RENDER_INTEGRITY_SKIP_POSTBUILD=1 npm run build
          npx next start -H 127.0.0.1 -p 4113 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:4113/states/FL | grep -q 'id="section-01"'; then
              break
            fi
            sleep 2
          done
          curl -sf http://127.0.0.1:4113/states/FL | grep -q 'id="section-01"'
          RENDER_INTEGRITY_EXTERNAL_SERVER=1 npm run test:render-integrity

      - name: Exclude fetch-failed artifacts from commit
        run: bash scripts/exclude-fetch-failed-artifacts.sh

      - name: Commit to data-refresh branch and open PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "ledger-data-bot"
          git config user.email "ledger-data-bot@users.noreply.github.com"
          git checkout -B data-refresh
          git add data/ lib/data/generated/sourcesIndex.json lib/data/generated/slices/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "chore(data): scheduled snapshot refresh"
          git push -u origin data-refresh --force
          EXISTING=$(gh pr list --head data-refresh --base main --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            echo "Updated existing PR #$EXISTING"
          else
            if gh pr create --base main --head data-refresh \
              --title "chore(data): scheduled snapshot refresh" \
              --body "Automated data refresh. Guard suites + build passed before commit. Fetch-failed artifacts excluded per §6."; then
              echo "Opened new data-refresh PR"
            else
              echo "::warning::Could not auto-create PR (repo may block GITHUB_TOKEN from creating PRs)."
              echo "Data was pushed to branch data-refresh — open a PR manually:"
              echo "https://github.com/${{ github.repository }}/compare/main...data-refresh"
            fi
          fi
